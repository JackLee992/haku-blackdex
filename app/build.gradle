plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdkVersion 33
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.jacklee.haku.blackdex"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 7
        versionName "0.2.0-dev.1"


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        flavorDimensions "BlackDex32"
    }

    productFlavors {
        BlackDex32 {
            applicationId "com.jacklee.haku.blackdex32"
            ndk {
                abiFilters "armeabi-v7a"
            }
            resValue "string", "app_name", "Haku BlackDex32 Dev"
        }

        BlackDex64 {
            applicationId "com.jacklee.haku.blackdex64"
            ndk {
                abiFilters "arm64-v8a"
            }
            resValue "string", "app_name", "Haku BlackDex64 Dev"
        }
    }

    signingConfigs {
        hakuDevelopment {
            // Local development identity only; haku/build-host.sh creates this ignored key.
            storeFile rootProject.file('.haku-build/signing/haku-development.jks')
            storePassword 'android'
            keyAlias 'haku-development'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.hakuDevelopment
            debuggable true
            jniDebuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.5.0'
    implementation project(':Bcore')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
